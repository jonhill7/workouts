name: Strava Sync

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: strava-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch activities from Strava
        run: node scripts/strava-sync.mjs
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_INCLUDE_NAMES: ${{ vars.STRAVA_INCLUDE_NAMES }}
      - name: Commit and redeploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet || [ -n "$(git status --porcelain app/data)" ]; then
            git config user.name "strava-sync[bot]"
            git config user.email "actions@users.noreply.github.com"
            git add app/data/strava.json
            git commit -m "Sync Strava activities"
            git push
            gh workflow run deploy.yml --ref main
          else
            echo "No new activities."
          fi
